  const localTopOffset = new THREE.Vector3(0, CARD_TOP_OFFSET, 0);

  function simulate(dt){

      if (p.pinned) { p.pos.copy(FIXED_POINT); p.prev.copy(FIXED_POINT); continue; }
      const vel = p.pos.clone().sub(p.prev).multiplyScalar(damp);
      p.prev.copy(p.pos);
      p.pos.add(vel);
      p.pos.addScaledVector(GRAVITY, dt*dt);
    }

    // Integrate card as an extra point chained to the rope end
    if (dragging){
      card.prev.copy(card.pos);
      card.pos.copy(dragTarget);
    } else {
      const vel = card.pos.clone().sub(card.prev).multiplyScalar(damp);
      card.prev.copy(card.pos);
      card.pos.add(vel);
      card.pos.addScaledVector(GRAVITY, dt*dt);
    }

    // Precompute the rotated attach-point offset once per step (rotation
    // itself only changes at the end of this function, so this is a cheap,
    // visually-consistent approximation — no more per-frame popping).
    cardEuler.set(card.tiltX, card.angleY, 0);
    rotatedTopOffset.copy(localTopOffset).applyEuler(cardEuler);

    // Constraint relaxation (distance constraints) for rope + card chain
    const iterations = 16;
    for (let iter=0; iter<iterations; iter++){

        const dist = delta.length() || 0.0001;
        const diff = (dist - SEGMENT_LEN) / dist;

        if (!a.pinned) a.pos.add(corr);

      const last = points[points.length-1];
      cardTopWorld.copy(card.pos).add(rotatedTopOffset);
      const delta = cardTopWorld.clone().sub(last.pos);
      const dist = delta.length() || 0.0001;
      const restLen = 0.02;
      const diff = (dist - restLen) / dist;
      const corr = delta.multiplyScalar(diff);
      if (!dragging){

        card.pos.add(corr.clone().multiplyScalar(-0.5));

    // ribbon always ends exactly at the visual clip, never lagging behind).

    card.topWorld = cardTopWorld;

    // but a strong enough swing (or a double-click flip) can carry it all
    // the way around so the back becomes visible, just like a real badge.
    if (!dragging){

      card.angVelY += -1.6 * Math.sin(card.angleY) * dt;       // "gravity" restoring torque

      card.angVelY *= 0.85;

    const right = new THREE.Vector3();
    for (let i=0;i<smooth.length;i++){

      if (i < smooth.length-1) dir = smooth[i+1].clone().sub(p);

    s.quadraticCurveTo(x+w,y+h, x+w,y+h-r);
    s.lineTo(x+w, y+r);
    s.quadraticCurveTo(x+w,y, x+w-r,y);
    s.lineTo(x+r, y);
    s.quadraticCurveTo(x,y, x,y+r);
    return s;
  }
  const cardGeo = new THREE.ExtrudeGeometry(roundedCardShape(CARD_W, CARD_H, CARD_R), {
    depth: CARD_T, bevelEnabled:true, bevelThickness:0.012, bevelSize:0.012, bevelSegments:3, curveSegments:12
  });
  cardGeo.center();

  // UV remap so front/back faces map cleanly (ExtrudeGeometry UVs are rough by default)
  (function remapCardUVs(){
    const pos = cardGeo.attributes.position;
    const uv = cardGeo.attributes.uv;
    for (let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i);
      uv.setXY(i, (x/CARD_W)+0.5, (y/CARD_H)+0.5);
    }
    uv.needsUpdate = true;
  })();

  const cardMatFront = new THREE.MeshPhysicalMaterial({
    map: cardTexture, clearcoat:0.6, clearcoatRoughness:0.25, roughness:0.35, metalness:0.08
  });
  const cardMatEdge = new THREE.MeshStandardMaterial({ color:0x0c0f16, roughness:0.5, metalness:0.2 });
  const cardMesh = new THREE.Mesh(cardGeo, [cardMatFront, cardMatEdge]);
  // ExtrudeGeometry from a Shape produces groups: 0 = front+back combined by default unless material array indices set.
  // To keep it simple & robust across three r128, we instead build front/back as separate planes on top of a thin box.
  scene.remove(cardMesh); // discard, use composite approach below for reliability

  const cardGroup = new THREE.Group();

  const bodyGeo = new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T);
  const bodyMat = new THREE.MeshPhysicalMaterial({ color:0x0c0f16, roughness:0.5, metalness:0.15, clearcoat:0.3 });
  const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
  cardGroup.add(bodyMesh);

  const frontGeo = new THREE.PlaneGeometry(CARD_W*0.985, CARD_H*0.985);
  const frontMat = new THREE.MeshPhysicalMaterial({
    map: cardTexture, clearcoat:0.7, clearcoatRoughness:0.2, roughness:0.3, metalness:0.05,
    iridescence:0.35, iridescenceIOR:1.25, iridescenceThicknessRange:[100,600]
  });
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  frontMesh.position.z = CARD_T/2 + 0.001;
  cardGroup.add(frontMesh);

  const backGeo = new THREE.PlaneGeometry(CARD_W*0.985, CARD_H*0.985);
  const backMat = new THREE.MeshStandardMaterial({ map: backTexture, roughness:0.6, metalness:0.05 });
  const backMesh = new THREE.Mesh(backGeo, backMat);
  backMesh.position.z = -CARD_T/2 - 0.001;
  backMesh.rotation.y = Math.PI;
  cardGroup.add(backMesh);

  // Hole + clip at top of card (visual grommet)
  const grommetGeo = new THREE.TorusGeometry(0.075, 0.018, 8, 20);
  const grommetMat = new THREE.MeshStandardMaterial({ color:0xcfd6e0, metalness:0.9, roughness:0.3 });
  const grommet = new THREE.Mesh(grommetGeo, grommetMat);
  grommet.position.set(0, CARD_H/2 - 0.16, 0);
  cardGroup.add(grommet);

  const clipGeo = new THREE.BoxGeometry(0.16, 0.22, 0.05);
  const clipMat = new THREE.MeshStandardMaterial({ color:0xb9c2cf, metalness:0.85, roughness:0.35 });
  const clipMesh = new THREE.Mesh(clipGeo, clipMat);
  clipMesh.position.set(0, CARD_TOP_OFFSET, 0);
  cardGroup.add(clipMesh);

  scene.add(cardGroup);

  // Invisible larger hit-plane for easier dragging on touch/mouse
  const hitGeo = new THREE.PlaneGeometry(CARD_W*1.15, CARD_H*1.1);
  const hitMat = new THREE.MeshBasicMaterial({ visible:false });
  const hitMesh = new THREE.Mesh(hitGeo, hitMat);
  cardGroup.add(hitMesh);

  // ---------------------------------------------------------------
  // Drag interaction (pointer -> unproject to a plane facing camera)
  // ---------------------------------------------------------------
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  const dragPlane = new THREE.Plane();
  const planeNormal = new THREE.Vector3();
  const intersectPoint = new THREE.Vector3();
  const hintEl = document.getElementById('hint');
  let hintShown = true;

  function setPointer(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((clientX-rect.left)/rect.width)*2 - 1;
    pointerNDC.y = -(((clientY-rect.top)/rect.height)*2 - 1);
  }

  function onPointerDown(clientX, clientY){
    setPointer(clientX, clientY);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(hitMesh, false);
    if (hits.length){
      dragging = true;
      camera.getWorldDirection(planeNormal);
      dragPlane.setFromNormalAndCoplanarPoint(planeNormal, hits[0].point);
      dragOffset.copy(hits[0].point).sub(card.pos);
      if (hintShown){ hintEl.style.opacity='0'; hintShown=false; }
    }
  }
  function onPointerMove(clientX, clientY){
    if (!dragging) return;
    setPointer(clientX, clientY);
    raycaster.setFromCamera(pointerNDC, camera);
    if (raycaster.ray.intersectPlane(dragPlane, intersectPoint)){
      dragTarget.copy(intersectPoint).sub(dragOffset);
    }
  }
  function onPointerUp(){ dragging = false; }

  renderer.domElement.addEventListener('mousedown', e=>onPointerDown(e.clientX,e.clientY));
  window.addEventListener('mousemove', e=>onPointerMove(e.clientX,e.clientY));
  window.addEventListener('mouseup', onPointerUp);

  renderer.domElement.addEventListener('touchstart', e=>{
    const t=e.touches[0]; onPointerDown(t.clientX,t.clientY); e.preventDefault();
  }, {passive:false});
  window.addEventListener('touchmove', e=>{
    if (!dragging) return;
    const t=e.touches[0]; onPointerMove(t.clientX,t.clientY); e.preventDefault();
  }, {passive:false});
  window.addEventListener('touchend', onPointerUp);

  renderer.domElement.style.cursor = 'grab';
  renderer.domElement.addEventListener('mousedown', ()=> renderer.domElement.style.cursor='grabbing');
  window.addEventListener('mouseup', ()=> renderer.domElement.style.cursor='grab');

  // Double-click / double-tap the card to flip it instantly
  function flipCard(){
    if (dragging) return;
    card.angVelY += 9.5;
    if (hintShown){ hintEl.style.opacity='0'; hintShown=false; }
  }
  renderer.domElement.addEventListener('dblclick', (e)=>{
    setPointer(e.clientX, e.clientY);
    raycaster.setFromCamera(pointerNDC, camera);
    if (raycaster.intersectObject(hitMesh, false).length) flipCard();
  });
  let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
  renderer.domElement.addEventListener('touchend', (e)=>{
    const t = e.changedTouches[0];
    const now = performance.now();
    if (now - lastTapTime < 320 && Math.hypot(t.clientX-lastTapX, t.clientY-lastTapY) < 40){
      setPointer(t.clientX, t.clientY);
      raycaster.setFromCamera(pointerNDC, camera);
      if (raycaster.intersectObject(hitMesh, false).length) flipCard();
    }
    lastTapTime = now; lastTapX = t.clientX; lastTapY = t.clientY;
  });

  // ---------------------------------------------------------------
  // Resize
  // ---------------------------------------------------------------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------------------------------------------------------------
  // Animate
  // ---------------------------------------------------------------
  let last = performance.now();
  const loadingEl = document.getElementById('loading');
  let faded = false;

  // Give the rope a tiny initial nudge so it settles with a bit of life
  points[Math.floor(SEGMENTS*0.6)].pos.x += 0.4;

  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min((now-last)/1000, 0.033);
    last = now;

    simulate(dt);
    updateStrapGeometry();

    cardGroup.position.copy(card.pos);
    cardGroup.rotation.set(card.tiltX, card.angleY, 0);

    renderer.render(scene, camera);

    if (!faded){ faded = true; loadingEl.style.opacity='0'; setTimeout(()=>loadingEl.style.display='none', 500); }
  }
  requestAnimationFrame(animate);

  setTimeout(()=>{ if (hintShown){ hintEl.style.opacity='1'; } }, 300);
  setTimeout(()=>{ if (!dragging){ hintEl.style.opacity='0'; } }, 6000);

})();
</script>
</body>
</html>
