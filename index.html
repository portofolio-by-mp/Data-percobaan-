<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>PLTS Monitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLTS Monitor">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0e1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #splash {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #0a0e1a;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #splash video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #skipBtn {
    position: fixed;
    bottom: env(safe-area-inset-bottom, 20px);
    right: 20px;
    z-index: 20;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    backdrop-filter: blur(4px);
  }
  #tapStart {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #0a0e1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: #fff;
  }
  #tapStart img {
    width: 96px;
    height: 96px;
    border-radius: 20px;
  }
  #tapStart .btn {
    background: #1e73ff;
    color: #fff;
    border: none;
    padding: 14px 32px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
  }
  #tapStart .hint {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
  }
  #appFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    z-index: 5;
  }
  #loadingText {
    position: fixed;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    z-index: 20;
  }
</style>
</head>
<body>

  <div id="splash">
    <video id="introVideo" autoplay playsinline webkit-playsinline></video>
    <div id="loadingText">Memuat PLTS Monitor…</div>
    <button id="skipBtn">Lewati</button>
  </div>

  <iframe id="appFrame" src="about:blank" allow="fullscreen; geolocation; camera; microphone"></iframe>

  <script>
    // ==== KONFIGURASI ====
    var WEBSITE_URL = "https://aaa-mortality-aerial-dates.trycloudflare.com";
    // ======================

    var video = document.getElementById('introVideo');
    var splash = document.getElementById('splash');
    var frame = document.getElementById('appFrame');
    var skipBtn = document.getElementById('skipBtn');
    var opened = false;

    video.src = "splash.mp4";

    function openApp() {
      if (opened) return;
      opened = true;
      frame.src = WEBSITE_URL;
      frame.style.display = "block";
      splash.style.display = "none";
    }

    // Coba autoplay BERSUARA dulu (browser mengizinkan ini kalau app sudah
    // di-install/dibuka dari home screen). Kalau ditolak browser (misal dibuka
    // lewat link biasa tanpa install), baru fallback ke mute otomatis supaya
    // video tetap jalan tanpa macet.
    video.play().catch(function () {
      video.muted = true;
      video.play();
    });

    video.addEventListener('ended', openApp);
    skipBtn.addEventListener('click', openApp);

    // fallback in case video fails to load/play
    video.addEventListener('error', openApp);
    setTimeout(function () {
      if (!opened && video.readyState === 0) openApp();
    }, 6000);

    // register service worker for offline app-shell caching
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
